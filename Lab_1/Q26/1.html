<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>image gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
   <div class="gallery-wrapper">
    <h1 class="gallery-title">Avengers Assemble</h1>
    <div class="gallery-grid">
        <div class="gallery-item">
            <div class="img-container">
                <img src="iron.jpg" alt="Iron man">
            </div>
            <p>Iron man</p>
        </div>
        <div class="gallery-item">
            <div class="img-container">
                <img src="black panther.jpg" alt="Black Panther">
            </div>
            <p>Black Panther</p>
        </div>
        <div class="gallery-item">
            <div class="img-container">
                <img src="thor.jpg" alt="Thor">
            </div>
            <p>Thor</p>
        </div>
        <div class="gallery-item">
            <div class="img-container">
                <img src="captain.jpg" alt="Captain America">
            </div>
            <p>Captain America</p>
        </div>
        <div class="gallery-item">
            <div class="img-container">
                <img src="spider.jpg" alt="Spiderman">
            </div>
            <p>Spiderman</p>
        </div>
        <div class="gallery-item">
            <div class="img-container">
                <img src="vision.jpg" alt="Vision">
            </div>
            <p>Vision</p>
        </div>
        <div class="gallery-item">
            <div class="img-container">
                <img src="doctor.jpg" alt="Doctor Strange">
            </div>
            <p>Doctor Strange</p>
        </div>
        <div class="gallery-item">
            <div class="img-container">
                <img src="hulk.jpg" alt="Hulk">
            </div>
            <p>Hulk</p>
        </div>
    </div>
</div>
</body>
</html>
