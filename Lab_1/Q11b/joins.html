<!DOCTYPE html>
<html>
<head>
    <title>Frameset Example</title>
</head>
<frameset cols="25%,50%,25%">
    <!-- Left section -->
    <frame src="1.html" scrolling="yes">

    <!-- Middle section split into two rows -->
    <frameset rows="50%,50%">
        <frame src="2.html" scrolling="yes">
        <frame src="3.html" scrolling="yes">
    </frameset>

    <!-- Right section -->
    <frame src="4.html" scrolling="yes">
</frameset>
</html>
