<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - TechInc</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="site-wrapper">
  <header>
    <nav id="navbar">
      <a id="logo" href="index.html">Supreme</a>
      <div class="nav-menu">
        <div class="nav-links">
          <a href="About.html">About us</a>
          <a href="Service.html">Services</a>
          <a href="gallery.html">Gallery</a>
          <a href="contact.html">Contact us</a>
        </div>
      </div>
    </nav>
  </header>

  <main class="main-content">
    <section class="contact-container">
      <h1>Contact Us</h1>
      <p>Have a question? Send us a message and we'll get back to you shortly.</p>
      
      <form class="contact-form">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" placeholder="Your Name" required>
        </div>
        
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="email@example.com" required>
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" placeholder="How can we help?" required></textarea>
        </div>

        <button type="submit" class="submit-btn">Send Message</button>
      </form>
    </section>
  </main>
</body>
</html>
