<!DOCTYPE html>
<html>
<body>

<h3>Image Map Example</h3>

<img src="./pexels-pavel-danilyuk-6340691.jpg" usemap="#map" width="400">

<map name="map">
  <!-- Rectangle -->
  <area shape="rect" coords="50,50,150,150" href="#" alt="Rectangle">

  <!-- Circle -->
  <area shape="circle" coords="250,100,50" href="#" alt="Circle">

  <!-- Polygon -->
  <area shape="poly" coords="200,200,300,200,250,300" href="#" alt="Polygon">
</map>

</body>
</html>
