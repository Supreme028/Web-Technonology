  <frameset cols="30%,*">
    
      <frameset rows="20%,*">
        <frame src="1.html">
        <frame src="2.html">
      </frameset>
    
      <frameset rows="*,*">
        <frameset cols="*,*">
    
        <frame src="3.html">
        <frame src="4.html">
          </frameset>
      <frameset cols="*,*,*">
        <frame src="5.html">
          <frame src="6.html">
            <frame src="7.html">

           
      </frameset>
      </frameset>
      </frameset>
    
      
  </frameset>
</head>
